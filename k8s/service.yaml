# NodePort: a stable address for the Pods, plus a fixed port on the node.
# Reachable at localhost:30080 if the k3d cluster was created with
#   k3d cluster create <name> -p "30080:30080@server:0"
# Otherwise fall back to: kubectl port-forward svc/agent-app 8000:80
apiVersion: v1
kind: Service
metadata:
  name: agent-app
spec:
  type: NodePort
  selector:
    app: agent-app
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
